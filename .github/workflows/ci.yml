name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — install & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build (TypeScript -> dist)
        run: npm run build
      - name: Boot API (in-memory Mongo) and hit health endpoint
        run: |
          node dist/server.js &
          SERVER_PID=$!
          sleep 8
          curl --fail http://localhost:5000/api/health
          kill $SERVER_PID

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check & build
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t skillbridge-backend ./backend
      - name: Build frontend image
        run: docker build -t skillbridge-frontend ./frontend
