# Render Blueprint — deploys the SkillBridge backend API.
# Set MONGO_URI (e.g. a MongoDB Atlas connection string) in the Render dashboard.
services:
  - type: web
    name: skillbridge-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      # Frontend origin(s) allowed by CORS (comma-separated for multiple).
      - key: CLIENT_URL
        value: https://skillbridge-git-main-1204vishwas-projects.vercel.app
