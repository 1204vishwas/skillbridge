services:
  mongo:
    image: mongo:7
    container_name: skillbridge-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: skillbridge-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/skillbridge
      - JWT_SECRET=change_me_in_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    container_name: skillbridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  mongo_data:
